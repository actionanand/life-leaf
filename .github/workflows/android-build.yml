name: Android APK and AAB

on:
  workflow_dispatch:
  pull_request:
    branches: [main-android]
  push:
    branches: [main-android]
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: life-leaf-android-${{ github.ref }}
  cancel-in-progress: false

env:
  MIN_SDK_VERSION: 24
  TARGET_SDK_VERSION: 36

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # - name: Unit tests
      #   run: npm test -- --configuration=ci

      - name: Auto-bump Android versionCode
        if: github.ref == 'refs/heads/main-android'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm run android:version
          git add android-version.json
          git diff --cached --quiet || git commit -m "chore: bump Android versionCode [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Resolve Android version
        run: |
          VERSION_CODE=$(node -p "require('./android-version.json').versionCode")
          VERSION_NAME=$(node -p "require('./android-version.json').versionName")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build Angular production application
        run: npm run build -- --configuration=production

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
          npm run android:patch

      - name: Apply Android versions and SDK levels
        working-directory: android/app
        run: |
          sed -i 's/versionCode [0-9]*/versionCode project.hasProperty("versionCode") ? project.versionCode.toInteger() : 1/' build.gradle
          sed -i 's/versionName "[^"]*"/versionName project.hasProperty("versionName") ? project.versionName : "0.1.0"/' build.gradle
          sed -i 's/minifyEnabled false/minifyEnabled true\n            shrinkResources true/' build.gradle
          sed -i "s/minSdkVersion = .*/minSdkVersion = $MIN_SDK_VERSION/" ../variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = $TARGET_SDK_VERSION/" ../variables.gradle

      - name: Generate branded launcher, splash and store icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          declare -A SIZES=([mipmap-mdpi]=48 [mipmap-hdpi]=72 [mipmap-xhdpi]=96 [mipmap-xxhdpi]=144 [mipmap-xxxhdpi]=192)
          for DIR in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DIR]}
            ART=$((SIZE * 70 / 100))
            mkdir -p "android/app/src/main/res/$DIR"
            convert src/assets/life-leaf.png -background none -resize "${ART}x${ART}" -gravity center -extent "${SIZE}x${SIZE}" "android/app/src/main/res/$DIR/ic_launcher.png"
            cp "android/app/src/main/res/$DIR/ic_launcher.png" "android/app/src/main/res/$DIR/ic_launcher_round.png"
            cp "android/app/src/main/res/$DIR/ic_launcher.png" "android/app/src/main/res/$DIR/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/drawable-nodpi releases
          convert src/assets/life-leaf.png -background none -resize 430x430 -gravity center -extent 512x512 android/app/src/main/res/drawable-nodpi/life_leaf_splash_logo.png
          convert src/assets/life-leaf.png -background none -resize 420x420 -gravity center -extent 512x512 releases/playstore-icon.png
          convert src/assets/life-leaf.png -background none -resize 72x72 -gravity center -extent 96x96 -channel A -threshold 10% +channel -fill white -colorize 100% android/app/src/main/res/drawable/ic_stat_life_leaf.png

      - name: Prepare release directory
        run: |
          mkdir -p releases
          rm -f releases/*.apk releases/*.aab releases/*.apk.idsig

      - name: Build debug APK
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Collect debug APK
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk releases/LifeLeaf-debug.apk

      - name: Build release APK and AAB
        if: github.ref == 'refs/heads/main-android' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Collect R8 deobfuscation mapping
        if: github.ref == 'refs/heads/main-android' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          test -s android/app/build/outputs/mapping/release/mapping.txt
          cp android/app/build/outputs/mapping/release/mapping.txt releases/LifeLeaf-release-mapping.txt

      - name: Decode release keystore
        id: keystore
        if: github.ref == 'refs/heads/main-android' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" ]] && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            rm -f android/app/release-keystore.jks
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign release APK and AAB
        id: sign
        if: steps.keystore.outputs.available == 'true'
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          APK=$(find android/app/build -name '*-release-unsigned.apk' | head -1)
          AAB=$(find android/app/build -name '*-release.aab' | head -1)
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" releases/LifeLeaf-release.apk
          "$BUILD_TOOLS/apksigner" sign --ks android/app/release-keystore.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD releases/LifeLeaf-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose releases/LifeLeaf-release.apk
          STORE_PASS_FILE=$(mktemp)
          KEY_PASS_FILE=$(mktemp)
          trap 'rm -f "$STORE_PASS_FILE" "$KEY_PASS_FILE"' EXIT
          printf '%s' "$KEYSTORE_PASSWORD" > "$STORE_PASS_FILE"
          printf '%s' "$KEY_PASSWORD" > "$KEY_PASS_FILE"
          jarsigner -keystore android/app/release-keystore.jks -storepass:file "$STORE_PASS_FILE" -keypass:file "$KEY_PASS_FILE" -signedjar releases/LifeLeaf-release.aab "$AAB" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs releases/LifeLeaf-release.aab

      - name: Collect unsigned release files
        if: (steps.keystore.outputs.available == 'false' || steps.sign.outcome == 'failure') && (github.ref == 'refs/heads/main-android' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: |
          rm -f releases/LifeLeaf-release.apk releases/LifeLeaf-release.aab
          cp "$(find android/app/build -name '*-release-unsigned.apk' | head -1)" releases/LifeLeaf-release-unsigned.apk
          cp "$(find android/app/build -name '*-release.aab' | head -1)" releases/LifeLeaf-release-unsigned.aab

      - name: Verify artifacts
        run: |
          find releases -maxdepth 1 -type f -print -exec ls -lh {} \;
          test -n "$(find releases -maxdepth 1 -name '*.apk' -type f -print -quit)"

      - name: Verify release APK and AAB pair
        if: github.ref == 'refs/heads/main-android' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          test -n "$(find releases -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$(find releases -maxdepth 1 -name '*.aab' -type f -print -quit)"

      - name: Commit release files to main-android
        if: github.ref == 'refs/heads/main-android'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add releases/
          git diff --cached --quiet || git commit -m "build: update Android release files [skip ci]"
          git push

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: life-leaf-android-${{ env.VERSION_NAME }}
          path: releases/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release-keystore.jks
