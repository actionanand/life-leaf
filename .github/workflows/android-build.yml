name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main-android]

permissions:
  contents: write

concurrency:
  group: life-leaf-android-${{ github.ref }}
  cancel-in-progress: false

env:
  MIN_SDK_VERSION: 24
  TARGET_SDK_VERSION: 36
  RELEASE_BASENAME: LifeLeaf

jobs:
  build:
    if: github.ref == 'refs/heads/main-android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # - name: Unit tests
      #   run: npm test -- --watch=false

      - name: Bump Android version code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm run android:version
          VERSION_CODE=$(node -p "require('./android-version.json').versionCode")
          git add android-version.json
          git diff --cached --quiet || git commit -m "chore: bump Android versionCode to $VERSION_CODE [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Resolve Android release name
        run: |
          VERSION_CODE=$(node -p "require('./android-version.json').versionCode")
          VERSION_NAME=$(node -p "require('./android-version.json').versionName")
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_FILE=${RELEASE_BASENAME}-${VERSION_NAME//./-}" >> "$GITHUB_ENV"

      - name: Build Angular production application
        run: npm run build -- --configuration=production

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
          npm run android:patch

      - name: Apply Android versions and SDK levels
        working-directory: android/app
        run: |
          sed -i 's/versionCode [0-9]*/versionCode project.hasProperty("versionCode") ? project.versionCode.toInteger() : 1/' build.gradle
          sed -i 's/versionName "[^"]*"/versionName project.hasProperty("versionName") ? project.versionName : "0.1.0"/' build.gradle
          sed -i "s/minSdkVersion = .*/minSdkVersion = $MIN_SDK_VERSION/" ../variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = $TARGET_SDK_VERSION/" ../variables.gradle

      - name: Generate branded launcher, splash and store icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          declare -A SIZES=([mipmap-mdpi]=48 [mipmap-hdpi]=72 [mipmap-xhdpi]=96 [mipmap-xxhdpi]=144 [mipmap-xxxhdpi]=192)
          for DIR in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DIR]}
            ART=$((SIZE * 70 / 100))
            mkdir -p "android/app/src/main/res/$DIR"
            convert src/assets/life-leaf.png -background none -resize "${ART}x${ART}" -gravity center -extent "${SIZE}x${SIZE}" "android/app/src/main/res/$DIR/ic_launcher.png"
            cp "android/app/src/main/res/$DIR/ic_launcher.png" "android/app/src/main/res/$DIR/ic_launcher_round.png"
            cp "android/app/src/main/res/$DIR/ic_launcher.png" "android/app/src/main/res/$DIR/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/drawable-nodpi releases
          convert src/assets/life-leaf.png -background none -resize 360x360 -gravity center -extent 512x512 android/app/src/main/res/drawable-nodpi/life_leaf_splash_logo.png
          convert src/assets/life-leaf.png -background none -resize 420x420 -gravity center -extent 512x512 releases/playstore-icon.png
          convert src/assets/life-leaf.png -background none -resize 72x72 -gravity center -extent 96x96 -channel A -threshold 10% +channel -fill white -colorize 100% android/app/src/main/res/drawable/ic_stat_life_leaf.png

      - name: Clear previous Android release artifacts
        run: |
          mkdir -p releases
          rm -f releases/*.apk releases/*.aab releases/*.apk.idsig releases/*-mapping.txt

      - name: Build unsigned release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Collect R8 deobfuscation mapping
        run: |
          MAPPING_SOURCE="android/app/build/outputs/mapping/release/mapping.txt"
          MAPPING_FILE="releases/${RELEASE_FILE}-mapping.txt"
          test -s "$MAPPING_SOURCE"
          cp "$MAPPING_SOURCE" "$MAPPING_FILE"
          test -s "$MAPPING_FILE"
          echo "MAPPING_FILE=$MAPPING_FILE" >> "$GITHUB_ENV"

      - name: Fetch signing secrets and decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            if printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "Signing secrets are available. Signed artifacts will be attempted."
            else
              rm -f android/app/release-keystore.jks
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "The keystore could not be decoded. Unsigned artifacts will be produced."
            fi
          else
            rm -f android/app/release-keystore.jks
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are incomplete. Unsigned artifacts will be produced."
          fi

      - name: Detect keystore type
        id: keystore_type
        if: steps.keystore.outputs.available == 'true'
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KS_TYPE=$(keytool -list -keystore android/app/release-keystore.jks -storepass:env KEYSTORE_PASSWORD 2>/dev/null | grep -i "Keystore type" | awk '{print $NF}')
          echo "type=$KS_TYPE" >> "$GITHUB_OUTPUT"

      - name: ✅ Create signed APK
        id: sign_apk
        if: steps.keystore.outputs.available == 'true'
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ steps.keystore_type.outputs.type == 'PKCS12' && secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          UNSIGNED_APK=$(find android/app/build -name '*-release-unsigned.apk' | head -1)
          OUTPUT_APK="releases/${RELEASE_FILE}.apk"
          test -s "$UNSIGNED_APK"
          rm -f "$OUTPUT_APK"
          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED_APK" "$OUTPUT_APK"
          "$BUILD_TOOLS/apksigner" sign --ks android/app/release-keystore.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD "$OUTPUT_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT_APK"

      - name: ⚠️ Create unsigned APK
        if: steps.keystore.outputs.available != 'true' || steps.sign_apk.outcome == 'failure'
        run: |
          UNSIGNED_APK=$(find android/app/build -name '*-release-unsigned.apk' | head -1)
          OUTPUT_APK="releases/${RELEASE_FILE}-unsigned.apk"
          test -s "$UNSIGNED_APK"
          rm -f "releases/${RELEASE_FILE}.apk" "$OUTPUT_APK"
          cp "$UNSIGNED_APK" "$OUTPUT_APK"

      - name: ✅ Create signed AAB
        id: sign_aab
        if: steps.keystore.outputs.available == 'true'
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ steps.keystore_type.outputs.type == 'PKCS12' && secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          UNSIGNED_AAB=$(find android/app/build -name '*-release.aab' | head -1)
          OUTPUT_AAB="releases/${RELEASE_FILE}.aab"
          test -s "$UNSIGNED_AAB"
          rm -f "$OUTPUT_AAB"
          STORE_PASS_FILE=$(mktemp)
          KEY_PASS_FILE=$(mktemp)
          trap 'rm -f "$STORE_PASS_FILE" "$KEY_PASS_FILE"' EXIT
          printf '%s' "$KEYSTORE_PASSWORD" > "$STORE_PASS_FILE"
          printf '%s' "$KEY_PASSWORD" > "$KEY_PASS_FILE"
          jarsigner -keystore android/app/release-keystore.jks -storepass:file "$STORE_PASS_FILE" -keypass:file "$KEY_PASS_FILE" -signedjar "$OUTPUT_AAB" "$UNSIGNED_AAB" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs "$OUTPUT_AAB"

      - name: ⚠️ Create unsigned AAB
        if: steps.keystore.outputs.available != 'true' || steps.sign_aab.outcome == 'failure'
        run: |
          UNSIGNED_AAB=$(find android/app/build -name '*-release.aab' | head -1)
          OUTPUT_AAB="releases/${RELEASE_FILE}-unsigned.aab"
          test -s "$UNSIGNED_AAB"
          rm -f "releases/${RELEASE_FILE}.aab" "$OUTPUT_AAB"
          cp "$UNSIGNED_AAB" "$OUTPUT_AAB"

      - name: Summarize and verify Android artifacts
        run: |
          APK_FILE=$(find releases -maxdepth 1 -name '*.apk' -type f | head -1)
          AAB_FILE=$(find releases -maxdepth 1 -name '*.aab' -type f | head -1)
          test -s "$APK_FILE"
          test -s "$AAB_FILE"
          test -s "$MAPPING_FILE"
          test -s releases/playstore-icon.png
          if [[ "$APK_FILE" == *-unsigned.apk ]]; then APK_LABEL="⚠️ Unsigned APK"; else APK_LABEL="✅ Signed APK"; fi
          if [[ "$AAB_FILE" == *-unsigned.aab ]]; then AAB_LABEL="⚠️ Unsigned AAB"; else AAB_LABEL="✅ Signed AAB"; fi
          echo "## Android artifact summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- $APK_LABEL: \`$APK_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- $AAB_LABEL: \`$AAB_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 🗺️ R8 mapping: \`$MAPPING_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 🎨 Play Store icon: \`releases/playstore-icon.png\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit release files to main-android
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add releases/
          if git diff --cached --quiet; then
            echo "Release files are unchanged."
          else
            git commit -m "build: update Android release files [skip ci]"
            git push
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: life-leaf-android-${{ env.VERSION_NAME }}
          path: |
            releases/*.apk
            releases/*.aab
            releases/*-mapping.txt
            releases/playstore-icon.png
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release-keystore.jks
