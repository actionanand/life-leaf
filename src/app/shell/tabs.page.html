<ion-tabs>
  <ion-tab-bar slot="bottom" aria-label="Primary navigation">
    <ion-tab-button tab="home" href="/home">
      <ion-icon name="home-outline" aria-hidden="true"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="calendar" href="/calendar">
      <ion-icon name="calendar-outline" aria-hidden="true"></ion-icon>
      <ion-label>Calendar</ion-label>
    </ion-tab-button>
    <ion-tab-button class="write-tab" routerLink="/write/new" aria-label="Write a new entry">
      <span class="write-icon"><ion-icon name="journal-outline" aria-hidden="true"></ion-icon></span>
      <ion-label>Write</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="memories" href="/memories">
      <ion-icon name="leaf-outline" aria-hidden="true"></ion-icon>
      <ion-label>Memories</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="settings" href="/settings">
      <ion-icon name="settings-outline" aria-hidden="true"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
